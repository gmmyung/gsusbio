[package]
name = "gsusbio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Maksim Drachov", "Gyungmin Myung"]
description = "Cross-platform async GS-USB CAN and CAN FD sockets"
license = "MIT"
readme = "README.md"
repository = "https://github.com/gmmyung/gsusbio"
documentation = "https://docs.rs/gsusbio"
publish = ["crates-io"]
keywords = ["can", "usb", "gs_usb", "candlelight", "canbus"]
categories = ["hardware-support", "embedded"]

[features]
default = ["tokio", "can-fd"]
tokio = ["dep:tokio", "nusb/tokio"]
blocking = []
can-fd = []

[dependencies]
arrayvec = "0.7"
nusb = "0.2.8"
thiserror = "1.0"
log = "0.4"
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[example]]
name = "classic"
path = "examples/classic.rs"
required-features = ["tokio"]

[[example]]
name = "fd"
path = "examples/fd.rs"
required-features = ["tokio", "can-fd"]

[[example]]
name = "blocking"
path = "examples/blocking.rs"
required-features = ["blocking"]

[[example]]
name = "loopback"
path = "examples/loopback.rs"
required-features = ["tokio", "can-fd"]
